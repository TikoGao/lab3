
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Grid Layout</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <h1>My Portfolio</h1>
        </header>

        <nav class="nav">
            <h2>Navigation</h2>
            <a href="#home">Home</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>

        <main class="main" id="home">
            <div class="card-grid" id="projects">
                <article class="card">
                    <h2>Card 1</h2>
                    <p>Welcome to my portfolio website.</p>
                </article>

                <article class="card">
                    <h2>Card 2</h2>
                    <p>This is my second content card.</p>
                </article>

                <article class="card">
                    <h2>Card 3</h2>
                    <p>This is my third content card.</p>
                </article>
            </div>
        </main>

        <footer class="footer" id="contact">
            <p>My Portfolio - 2026</p>
        </footer>
    </div>
</body>
</html>
